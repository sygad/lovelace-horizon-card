name: Build & Test

# The project's checks: lint, unit tests and a production build of the card. Runs on every
# pull request and on every push to main, so main is always known to be green. This never
# publishes anything - releases are cut by hand from release.yaml (see RELEASING.md).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Upload built card
        uses: actions/upload-artifact@v4
        with:
          name: lovelace-horizon-card
          path: dist/lovelace-horizon-card.js
          if-no-files-found: error
